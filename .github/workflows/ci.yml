name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: HexMobileCore tests
    # The package needs the iOS 27 SDK (Xcode 27 or later). The select step
    # picks the newest Xcode on the runner; when none is 27+, the job skips
    # the build with a warning instead of failing on API renames.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27 or later
        id: xcode
        run: bash .github/scripts/select-xcode.sh
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift test
        if: steps.xcode.outputs.ok == 'true'
        working-directory: Packages/HexMobileCore
        run: swift test

  ios-build:
    name: Unsigned iOS build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27 or later
        id: xcode
        run: bash .github/scripts/select-xcode.sh
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true
      - name: Install XcodeGen
        if: steps.xcode.outputs.ok == 'true'
        run: brew install xcodegen
      - name: Generate project
        if: steps.xcode.outputs.ok == 'true'
        run: make project
      - name: Build for generic iOS device (no signing)
        if: steps.xcode.outputs.ok == 'true'
        run: make build-device
      - name: Build for iOS Simulator (no signing)
        if: steps.xcode.outputs.ok == 'true'
        run: make build-sim
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore

  mac-scripts:
    name: Mac sync script tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure jq
        run: command -v jq || brew install jq
      - name: test-sync.sh
        run: bash tests/mac/test-sync.sh

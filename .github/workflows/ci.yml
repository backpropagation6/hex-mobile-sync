name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: HexMobileCore tests
    # The package needs swift-tools-version 6.2; the runner image must ship
    # Xcode 27 or later. Pin a newer image here when macos-latest lags behind.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift test
        working-directory: Packages/HexMobileCore
        run: swift test

  ios-build:
    name: Unsigned iOS build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: make project
      - name: Build for generic iOS device (no signing)
        run: make build-device
      - name: Build for iOS Simulator (no signing)
        run: make build-sim
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore

  mac-scripts:
    name: Mac sync script tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure jq
        run: command -v jq || brew install jq
      - name: test-sync.sh
        run: bash tests/mac/test-sync.sh
